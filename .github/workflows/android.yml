name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fast_checks:
        description: 'Run JVM tests and build without emulators'
        type: boolean
        default: false
      test_older_android:
        description: 'Also test Android 11 with small screen and large font'
        type: boolean
        default: false
      require_persistent_signing:
        description: 'Require a configured persistent signing key'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source and documentation archives
        run: |
          mkdir -p "$RUNNER_TEMP/podyom/source" "$RUNNER_TEMP/podyom/guide/docs"
          git archive --format=zip --output="$RUNNER_TEMP/podyom/source/podyom-source.zip" HEAD
          cp README.md AGENTS.md "$RUNNER_TEMP/podyom/guide/"
          cp docs/*.md "$RUNNER_TEMP/podyom/guide/docs/"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: podyom-source
          path: ${{ runner.temp }}/podyom/source/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload installation and OriginOS guide
        uses: actions/upload-artifact@v4
        with:
          name: podyom-guide
          path: ${{ runner.temp }}/podyom/guide/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/build/downloadable-debug-apk' }}
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore optional persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PODYOM_KEYSTORE_BASE64 }}
          REQUIRE_PERSISTENT_SIGNING: ${{ inputs.require_persistent_signing }}
          KEYSTORE_PASSWORD: ${{ secrets.PODYOM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PODYOM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PODYOM_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::The persistent signing key is missing its password or alias configuration."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/podyom-signing.keystore"
            chmod 600 "$RUNNER_TEMP/podyom-signing.keystore"
            echo "PODYOM_KEYSTORE_PATH=$RUNNER_TEMP/podyom-signing.keystore" >> "$GITHUB_ENV"
          elif [ "$REQUIRE_PERSISTENT_SIGNING" = true ]; then
            echo "::error::A persistent signing key is required for this run."
            exit 1
          else
            echo "::notice::No persistent key is configured. This APK uses a disposable test certificate."
          fi
      - name: Download published 0.4.0 APK for certificate comparison
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: podyom-debug-apk
          run-id: 45711080102
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/podyom/previous
      - name: Cache Robolectric Android 16 runtime
        uses: actions/cache@v4
        with:
          path: .gradle/robolectric-sdk
          key: robolectric-4.17-android-16-13921718-i7
      - name: Download and verify Robolectric runtime
        run: |
          sdk_dir="$GITHUB_WORKSPACE/.gradle/robolectric-sdk"
          filename=android-all-instrumented-16-robolectric-13921718-i7.jar
          artifact="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/$filename"
          mkdir -p "$sdk_dir"
          cd "$sdk_dir"
          if [ ! -s "$filename" ] || [ ! -s "$filename.sha512" ] || ! sha512sum --check --status "$filename.sha512"; then
            curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-max-time 150 "$artifact.sha512" -o checksum.txt
            printf '%s  %s\n' "$(cat checksum.txt)" "$filename" > "$filename.sha512"
            curl --fail --location --silent --show-error --retry 6 --retry-all-errors --retry-max-time 150 "$artifact" -o "$filename"
            rm -f checksum.txt
          fi
          sha512sum --check "$filename.sha512"
          echo "PODYOM_ROBOLECTRIC_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"
      - name: Build and lint
        id: binaries
        timeout-minutes: 10
        env:
          PODYOM_KEYSTORE_PASSWORD: ${{ secrets.PODYOM_KEYSTORE_PASSWORD }}
          PODYOM_KEY_ALIAS: ${{ secrets.PODYOM_KEY_ALIAS }}
          PODYOM_KEY_PASSWORD: ${{ secrets.PODYOM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain 2>&1 | tee "$RUNNER_TEMP/podyom-build.log"
      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/podyom-debug.apk
          ./scripts/signing-report.sh dist/podyom-debug.apk "$RUNNER_TEMP/podyom/signing" "$RUNNER_TEMP/podyom/previous/podyom-debug.apk"
          cp docs/SMART_ALARMS_0.5.0.md "$RUNNER_TEMP/podyom/signing/"
          cp "$RUNNER_TEMP/podyom/signing/SIGNING.md" dist/
          cp docs/SMART_ALARMS_0.5.0.md dist/
          cd dist
          sha256sum podyom-debug.apk > SHA256SUMS
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: podyom-debug-apk
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Run Kotlin and Robolectric tests
        id: tests
        timeout-minutes: 8
        env:
          PODYOM_KEYSTORE_PASSWORD: ${{ secrets.PODYOM_KEYSTORE_PASSWORD }}
          PODYOM_KEY_ALIAS: ${{ secrets.PODYOM_KEY_ALIAS }}
          PODYOM_KEY_PASSWORD: ${{ secrets.PODYOM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :core:test :app:testDebugUnitTest --console=plain 2>&1 | tee -a "$RUNNER_TEMP/podyom-build.log"
      - name: Check emulator availability
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' && !inputs.fast_checks }}
        id: emulator
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "KVM is unavailable on this runner."
          fi
      - name: Run Android 16 instrumentation
        if: ${{ !cancelled() && steps.emulator.outputs.available == 'true' }}
        id: instrumentation
        timeout-minutes: 12
        env:
          PODYOM_KEYSTORE_PASSWORD: ${{ secrets.PODYOM_KEYSTORE_PASSWORD }}
          PODYOM_KEY_ALIAS: ${{ secrets.PODYOM_KEY_ALIAS }}
          PODYOM_KEY_PASSWORD: ${{ secrets.PODYOM_KEY_PASSWORD }}
        run: |
          bash scripts/run-instrumentation.sh 36
      - name: Run Android 11 instrumentation
        if: ${{ !cancelled() && steps.emulator.outputs.available == 'true' && inputs.test_older_android }}
        id: older_instrumentation
        timeout-minutes: 12
        env:
          PODYOM_KEYSTORE_PASSWORD: ${{ secrets.PODYOM_KEYSTORE_PASSWORD }}
          PODYOM_KEY_ALIAS: ${{ secrets.PODYOM_KEY_ALIAS }}
          PODYOM_KEY_PASSWORD: ${{ secrets.PODYOM_KEY_PASSWORD }}
        run: |
          timeout 30s adb -s emulator-5554 wait-for-disconnect || true
          bash scripts/run-instrumentation.sh 30
      - name: Prepare verification reports
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.binaries.outcome == 'success' && steps.tests.outcome || steps.binaries.outcome }}
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: |
          python3 scripts/package-check-results.py "$RUNNER_TEMP/podyom/results" --build-outcome "$BUILD_OUTCOME" --build-log "$RUNNER_TEMP/podyom-build.log" --emulator-outcome "$EMULATOR_OUTCOME"
          if [ -f app/build/reports/lint-results-debug.xml ]; then
            python3 - <<'PY'
          import collections
          import xml.etree.ElementTree as ET
          issues = ET.parse("app/build/reports/lint-results-debug.xml").getroot().findall("issue")
          for (severity, rule), count in sorted(collections.Counter((issue.get("severity"), issue.get("id")) for issue in issues).items()):
              print(f"Lint {severity} {rule}: {count}")
          PY
          fi
          if [ -f app/schemas/ru.podyom.data.RuntimeDatabase/3.json ]; then
            cp -r app/schemas "$RUNNER_TEMP/podyom/results/"
            python3 -c 'import json; print("Room 3 identity: " + json.load(open("app/schemas/ru.podyom.data.RuntimeDatabase/3.json"))["database"]["identityHash"])'
          fi
          for emulator_log in "$RUNNER_TEMP"/podyom-emulator-*.log; do
            if [ -f "$emulator_log" ]; then cp "$emulator_log" "$RUNNER_TEMP/podyom/results/"; fi
          done
          for test_report in app/build/instrumentation-api*; do
            if [ -d "$test_report" ]; then cp -r "$test_report" "$RUNNER_TEMP/podyom/results/"; fi
          done
          if [ -d "$RUNNER_TEMP/podyom/signing" ]; then
            cp -r "$RUNNER_TEMP/podyom/signing" "$RUNNER_TEMP/podyom/results/"
          fi
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podyom-check-results
          path: ${{ runner.temp }}/podyom/results/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/podyom-signing.keystore"
